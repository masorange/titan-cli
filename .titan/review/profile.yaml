version: 1

file_roles:
  tests:
    - "tests/**"
    - "plugins/*/tests/**"
    - ".titan/steps/test_*.py"
    - ".titan/operations/*test*"

  config_or_contracts:
    - ".titan/config.toml"
    - ".titan/workflows/**"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
    - "titan_cli/core/models.py"
    - "titan_cli/core/plugins/models.py"
    - "plugins/*/*/models/**"

  workflow_orchestration:
    - "titan_cli/core/workflows/**"
    - "titan_cli/engine/**"
    - "titan_cli/ui/tui/screens/workflow_execution.py"
    - "plugins/*/*/steps/**"
    - "plugins/*/*/workflows/**"
    - ".titan/steps/**"
    - ".titan/workflows/**"

  integration_or_adapter:
    - "titan_cli/ai/providers/**"
    - "titan_cli/ai/litellm_client.py"
    - "titan_cli/external_cli/**"
    - "plugins/*/*/clients/**"
    - "plugins/*/*/clients/services/**"
    - "plugins/*/*/models/mappers/**"
    - "plugins/*/*/models/network/**"

  entrypoints_or_ui:
    - "titan_cli/ui/**"
    - "titan_cli/commands/**"
    - "titan_cli/preview.py"
    - "plugins/*/*/widgets/**"

  business_logic:
    - "titan_cli/core/**"
    - "titan_cli/engine/**"
    - "titan_cli/ai/**"
    - "plugins/*/*/operations/**"
    - "plugins/*/*/managers/**"
    - "plugins/*/*/agents/**"

review_axes:
  functional_correctness:
    always_include: true

  error_handling:
    always_include: true

  semantic_correctness:
    patterns:
      - "plugins/*/*/models/mappers/**"
      - "**/*mapper*"
      - "**/*serializer*"
      - "**/*parser*"
      - "**/*formatter*"
      - "**/*normalizer*"
      - "**/*validator*"
      - "**/*messages.py"
      - "**/*formatting.py"
      - "**/*prompt*"

  state_consistency:
    patterns:
      - "titan_cli/engine/**"
      - "titan_cli/core/workflows/**"
      - "titan_cli/ui/tui/screens/workflow_execution.py"
      - "plugins/*/*/steps/**"
      - "plugins/*/*/operations/thread_*"
      - "plugins/*/*/operations/review_action_*"
      - "**/*state*"
      - "**/*result*"
      - "**/*context*"
      - "**/*thread*"

  api_contract:
    patterns:
      - "titan_cli/core/models.py"
      - "titan_cli/core/plugins/models.py"
      - "plugins/*/*/plugin.py"
      - "plugins/*/*/protocols.py"
      - "plugins/*/*/models/**"
      - "plugins/*/*/clients/**"
      - "plugins/*/*/clients/services/**"
      - "plugins/*/*/workflows/**/*.yaml"
      - "titan_cli/core/workflows/**/*.yaml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*schema*"

  data_validation:
    patterns:
      - "titan_cli/core/config.py"
      - "titan_cli/core/models.py"
      - "titan_cli/core/plugins/models.py"
      - "plugins/*/*/models/**"
      - "**/*validator*"
      - "**/*request*"

  security:
    patterns:
      - "titan_cli/core/secrets.py"
      - "titan_cli/ai/oauth_helper.py"
      - "**/*secret*"
      - "**/*token*"
      - "**/*auth*"
      - "**/*credential*"

  concurrency:
    patterns:
      - "titan_cli/ui/tui/**"
      - "titan_cli/engine/**"
      - "**/*thread*"
      - "**/*async*"

  performance:
    patterns:
      - "titan_cli/core/workflows/**"
      - "titan_cli/engine/**"
      - "titan_cli/ai/**"
      - "plugins/*/*/clients/**"

  test_coverage:
    patterns:
      - "tests/**"
      - "plugins/*/tests/**"
      - "**/*test*"

  documentation:
    patterns:
      - ".claude/**"
      - ".titan/**"
      - "AGENTS.md"
      - "docs/**"
      - "README.md"
      - "DEVELOPMENT.md"
