# The secrets trust boundary and the import boundary that enforces it: a small change
# here decides whether a credential can leak, so it is always read in full.
always_deep:
  - "titan_cli/core/security/**"
  - "titan_cli/ai/oauth_helper.py"
  - "titan_cli/core/interrupt.py"

# Consulted, not read end to end: the rules steps, plugins and secrets handling are held to.
context_docs:
  - "CLAUDE.md"
  - ".claude/docs/plugin-architecture.md"
  - ".claude/docs/workflow-step-rules.md"
  - ".claude/docs/operations.md"
  - ".claude/docs/security.md"
  - ".claude/docs/workflows.md"
  - ".claude/docs/textual.md"

