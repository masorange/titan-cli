# Review profile for titan-cli.
#
# Merged onto Titan's default profile KEY BY KEY: a role, an attention tier or a review
# axis defined here replaces Titan's entry for that key, and everything not named here
# keeps Titan's default. Only fields that still decide something are listed:
#   file_roles    -> which role a changed file plays (the role asking for the most
#                    attention wins when several match)
#   attention     -> deep / glance / skip per role (Titan's defaults are used here)
#   always_deep   -> paths read in full on any change, whatever their role
#   context_docs  -> project documents the review session consults before judging
#   review_axes   -> when each checklist axis applies

version: 1

change_patterns:
  central_behavior:
    - "titan_cli/core/**"
    - "titan_cli/engine/**"
    - "titan_cli/ai/**"
    - "plugins/*/*/operations/**"
    - "plugins/*/*/clients/**"
    - "plugins/*/*/managers/**"
    - "plugins/*/*/models/validators.py"
    - "titan_cli/engine/context.py"
    - "titan_cli/engine/results.py"

  entrypoint:
    - "titan_cli/cli.py"
    - "titan_cli/commands/**"
    - "titan_cli/preview.py"
    - "plugins/*/*/plugin.py"
    - "plugins/*/*/steps/**"
    - "plugins/*/*/workflows/*.yaml"
    - "titan_cli/ui/tui/screens/workflow_execution.py"

  repeated_callsite:
    - "titan_cli/ui/components/**"
    - "titan_cli/ui/views/**"
    - "titan_cli/ui/tui/widgets/**"
    - "plugins/*/*/widgets/**"
    - "plugins/*/*/workflows/**"
    - ".titan/workflows/**"

file_roles:
  tests:
    - "tests/**"
    - "plugins/*/tests/**"
    - ".titan/steps/test_*.py"
    - ".titan/operations/*test*"

  config_or_contracts:
    - ".titan/config.toml"
    - "**/*.toml"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"
    - "titan_cli/core/plugins/models.py"
    - "plugins/*/*/models/**"

  # Workflow YAML is also config; this role asks for more attention, so it wins.
  workflow_orchestration:
    - "titan_cli/core/workflows/**"
    - "titan_cli/engine/**"
    - "titan_cli/ui/tui/screens/workflow_execution.py"
    - "plugins/*/*/steps/**"
    - "plugins/*/*/workflows/**"
    - ".titan/steps/**"
    - ".titan/workflows/**"

  integration_or_adapter:
    - "titan_cli/ai/providers/**"
    - "titan_cli/ai/litellm_client.py"
    - "titan_cli/external_cli/**"
    - "titan_cli/clients/**"
    - "titan_cli/ports/**"
    - "plugins/*/*/clients/**"
    - "plugins/*/*/models/mappers/**"
    - "plugins/*/*/models/network/**"

  entrypoints_or_ui:
    - "titan_cli/ui/**"
    - "titan_cli/commands/**"
    - "titan_cli/cli.py"
    - "plugins/*/*/widgets/**"

  business_logic:
    - "titan_cli/core/**"
    - "titan_cli/ai/**"
    - "titan_cli/application/**"
    - "plugins/*/*/operations/**"
    - "plugins/*/*/managers/**"
    - "plugins/*/*/agents/**"
    - "plugins/*/*/plugin.py"

