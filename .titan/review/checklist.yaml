version: 1

# Merged by `id` onto Titan's twelve default axes: an entry here replaces the default
# with that id, everything not listed keeps Titan's wording. `id` must be one of the
# twelve categories. WHEN an axis applies lives in profile.yaml (`review_axes`), not here.
# The deep review session reads each description as one prompt line, and anything past
# 200 characters is cut, so each one says what to look for in THIS repo and stops.

items:
  - id: error_handling
    name: Error Handling
    description: Swallowed failures, steps that raise instead of returning Error, ClientResult handled with try/except or without match, and failures that never reach the user.

  - id: api_contract
    name: API Contract
    description: Breaking changes to workflow YAML, step names, plugin get_steps()/client surface, config models and serialized payloads; public plugin docs left stale.

  - id: semantic_correctness
    name: Semantic Correctness
    description: Mappers, prompts, formatters and classifiers that still run but now mean something else; Network-to-UI conversions that drop or relabel a field.

  - id: state_consistency
    name: State Consistency
    description: Step outputs written to ctx.data instead of Success(metadata=...), wrong Success/Skip/Error/Exit choice, and thread or review status that disagrees with what happened.

  - id: security
    name: Security
    description: Raw secrets outside core/security (broker use-primitives only), credentials on argv or env, secrets in ctx.data or result metadata, tokens or sensitive values in logs.

  - id: concurrency
    name: Concurrency
    description: Blocking calls in workflow threads not wrapped in run_interruptible, Textual widgets touched off the UI thread, shared mutable state across runs.

  - id: code_style
    name: Architecture & Maintainability
    description: Steps calling low-level client methods, business logic outside operations/, UI models bypassed by dicts, magic values, and logic in the wrong layer.

  - id: documentation
    name: Documentation
    description: Public plugin behavior changed without updating docs/plugins/<plugin>/ or .claude/docs; comments that cite decision ids instead of explaining the constraint.
