[mod]
name = "git"
version = "0.6.0"
icon = "⎇"
description = "Side panel with the current branch, its pull, push, pull request and merges, the latest commits, a switcher for the branches you use most and the worktrees"
requires_plugins = ["git"]
events = ["app.start", "workflow.run", "ui.render", "section.change"]
slots = ["pane", "toast"]
ai_task = "Branch name suggestion"

[sections.repo]
title = "Repository"
description = "The branch you are on, its upstream and the latest commits."

[sections.branches]
title = "Branch switcher"
description = "The branches you used most recently, one press to switch to them."

[sections.worktrees]
title = "Worktrees"
description = "The repository's worktrees, each folding into its removal."

[options.repo_refresh_seconds]
type = "int"
title = "Repository refresh (s)"
default = 30
min = 1

[options.refresh_key]
type = "string"
title = "Refresh key"
description = "Key that refreshes the branch and commits now; empty for none."
default = "f5"

[options.recent_commits]
type = "int"
title = "Recent commits shown"
default = 10
min = 0

[options.graph_max_lanes]
type = "int"
title = "Graph lanes shown"
description = "Draw the commit graph while it fits in this many lanes; beyond it, a plain list."
default = 4
min = 1

[options.branches_refresh_seconds]
type = "int"
title = "Branches refresh (s)"
default = 60
min = 1

[options.recent_branches]
type = "int"
title = "Branches shown"
default = 8
min = 1

[options.branch_filter_threshold]
type = "int"
title = "Filter field from"
description = "Show a filter field once the switcher lists this many branches."
default = 8
min = 1

[options.commit_workflow]
type = "string"
title = "Commit workflow"
description = "Workflow offered when uncommitted changes block a switch; empty for no button."
default = "commit-ai"

[options.create_pr_workflow]
type = "string"
title = "Create PR workflow"
description = "Workflow the Create PR button runs on the branch you are on; a repo extending it runs instead. Empty for no button."
default = "create-pr-ai"

[options.suggestion_diff_chars]
type = "int"
title = "Diff sent for a branch name"
description = "How much of the uncommitted diff the AI reads to suggest a branch name."
default = 4000
min = 200

[options.merge_workflow]
type = "string"
title = "Merge workflow"
description = "Workflow the merge picker runs, given target_branch and source_branch; empty for no merge action."
default = "merge-branch"

[options.worktrees_refresh_seconds]
type = "int"
title = "Worktrees refresh (s)"
default = 120
min = 1
