name: "Merge Into Branch"
description: "Switch to a branch and merge another one into it"

params:
  # Empty means "ask": the switch step offers the branches ordered by recent use.
  target_branch: ""
  # Empty means "use the base branch configured for the project".
  source_branch: ""

steps:
  - id: switch
    name: "Switch Branch"
    plugin: git
    step: switch_branch
    params:
      branch: "${target_branch}"

  # The whole merge, conflict resolution included, so a project extending
  # merge-branch gets its hooks here too.
  - id: merge
    name: "Merge"
    workflow: "merge-branch"
    params:
      source_branch: "${source_branch}"
