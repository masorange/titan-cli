name: "Merge Branch"
description: "Merge a branch (or the base branch) into another one (or the current one), with AI-assisted conflict resolution and an optional push"

params:
  # The branch the merge lands on. Empty means the one already checked out;
  # anything else is checked out first, once the merge is known to be possible.
  target_branch: ""
  # Empty means "use the base branch configured for the project".
  # Override it with `extends` + params, or from a step injected in before_merge.
  source_branch: ""
  remote: "origin"
  # The merge commit only carries git's own merge message, so pre-commit hooks
  # are skipped: a hook failing there leaves the merge stopped with everything
  # staged. Set to false to run them, or lint from the after_merge hook.
  # Deliberately not named `no_verify`: that key is read by `create_commit`, and
  # ctx.data is shared with workflows nested from the hooks.
  merge_commit_no_verify: true

hooks:
  - before_merge
  - after_merge

steps:
  # Injection point for overriding source_branch before anything is resolved
  - hook: before_merge

  - id: resolve_target
    name: "Resolve Merge Target"  # switches to target_branch when one is given
    plugin: git
    step: resolve_merge_target

  - id: fetch_source
    name: "Fetch Source Branch"
    plugin: git
    step: fetch_merge_source

  - id: merge
    name: "Merge"
    plugin: git
    step: merge_source_branch

  # Skips itself when merge_conflict_context is absent (i.e. no conflicts).
  # on_error: continue so complete_merge still runs and can offer to abort.
  - id: resolve_conflicts
    name: "Resolve Conflicts with AI"
    plugin: core
    step: ai_code_assistant
    params:
      context_key: "merge_conflict_context"
      ask_confirmation: true
      fail_on_decline: false
    on_error: continue

  - id: complete
    name: "Complete Merge"
    plugin: git
    step: complete_merge

  # The merge only counts once GitHub sees it, so the branch is offered for
  # pushing right here. It asks first, and skips itself when the merge changed
  # nothing (already up to date) or the user aborted it, since an abort exits
  # the workflow before this step.
  - id: push_merge
    name: "Push Merge"
    plugin: git
    step: push
    params:
      confirm_push: true

  - hook: after_merge
