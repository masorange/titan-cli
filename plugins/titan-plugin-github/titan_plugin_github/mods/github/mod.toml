[mod]
name = "github"
version = "0.1.0"
icon = "🔀"
description = "Side panel with the repo's GitHub at a glance (reviews waiting, your PRs, the merge queue, failing runs) and a button that opens the GitHub workspace"
requires_plugins = ["github"]
events = ["app.start", "workflow.run", "ui.render"]
slots = ["pane", "toast"]

[options.prs_refresh_seconds]
type = "int"
title = "PRs refresh (s)"
default = 30
min = 1

[options.queue_refresh_seconds]
type = "int"
title = "Merge queue refresh (s)"
default = 60
min = 1

[options.runs_refresh_seconds]
type = "int"
title = "Workflow runs refresh (s)"
default = 30
min = 1

[options.refresh_key]
type = "string"
title = "Refresh key"
description = "Key that refreshes every section now; empty for none."
default = "f5"

[options.queue_shown]
type = "int"
title = "Queue entries shown"
default = 8
min = 0
