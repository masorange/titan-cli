name: "Review PR"
description: "Free-form AI review of the PR; Titan dedupes, anchors and lets you approve each comment"

steps:
  - id: select_pr
    name: "Select PR to Review"
    plugin: github
    step: select_pr_for_code_review

  - id: fetch_bundle
    name: "Fetch PR Review Bundle"
    plugin: github
    step: fetch_pr_review_bundle

  - id: build_manifest
    name: "Build Change Manifest"
    plugin: github
    step: build_change_manifest

  - id: build_comments_index
    name: "Build Existing Comments Index"
    plugin: github
    step: build_existing_comments_index

  # The review reads the PR checked out here, with its material written alongside.
  - id: create_worktree
    name: "Create PR Worktree"
    plugin: github
    step: create_worktree
    on_error: continue

  - id: write_material
    name: "Write Review Material"
    plugin: github
    step: write_review_material
    on_error: continue

  # One free-form session of the configured CLI: it reviews the PR as it would if a user
  # asked it to. Titan prescribes no procedure; everything after it is Titan's.
  - id: ai_findings
    name: "Review"
    plugin: github
    step: ai_review_findings
    on_error: continue

  - id: normalize
    name: "Normalize Findings"
    plugin: github
    step: normalize_findings
    on_error: continue

  - id: dedupe
    name: "Deduplicate Findings"
    plugin: github
    step: dedupe_findings
    on_error: continue

  - id: build_actions
    name: "Build Comment Actions"
    plugin: github
    step: build_new_comment_actions
    on_error: continue

  - id: validate_actions
    name: "Validate & Approve Actions"
    plugin: github
    step: validate_review_actions
    on_error: continue

  - id: submit_actions
    name: "Submit Review"
    plugin: github
    step: submit_review_actions
    on_error: continue

  # Backstop only: validate_actions releases the worktree itself right after
  # precomputing every action's code context (so abandoning the review at an
  # interactive gate can't leave a stale worktree). This step covers the paths that
  # never reach validate_actions and the rare early-release failure.
  # on_error: continue so a failed cleanup never masks the review's outcome.
  - id: cleanup_worktree
    name: "Cleanup PR Worktree"
    plugin: github
    step: cleanup_worktree
    on_error: continue
