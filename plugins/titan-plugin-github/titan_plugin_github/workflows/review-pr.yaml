name: "Review PR"
description: "Focused AI review for new actionable findings with bounded prompt context"

steps:
  - id: select_pr
    name: "Select PR to Review"
    plugin: github
    step: select_pr_for_code_review

  - id: fetch_bundle
    name: "Fetch PR Review Bundle"
    plugin: github
    step: fetch_pr_review_bundle

  - id: build_manifest
    name: "Build Change Manifest"
    plugin: github
    step: build_change_manifest

  - id: build_comments_index
    name: "Build Existing Comments Index"
    plugin: github
    step: build_existing_comments_index

  - id: classify_pr
    name: "Classify PR"
    plugin: github
    step: classify_pr

  - id: score_candidates
    name: "Score Review Candidates"
    plugin: github
    step: score_review_candidates

  - id: build_checklist
    name: "Build Review Checklist"
    plugin: github
    step: build_review_checklist

  # No AI call here. The attention plan already decided which files are deep, and on run
  # 4fd7f345 the model it replaced spent 92,463 input tokens and 38.8s choosing 7 of
  # those 9 files, leaving two unreviewed.
  - id: build_plan
    name: "Review Plan"
    plugin: github
    step: build_review_plan

  # Call 1 of two. Diffs only, no repo access, its own (cheap) model: a first pass over
  # every reviewable file the deep session will not open. It publishes nothing — what it
  # flags travels into the deep prompt for that session to settle. Best-effort: a failed
  # skim leaves those files where they already were, unlooked-at.
  - id: ai_scan
    name: "Skim The Rest Of The PR"
    plugin: github
    step: ai_review_scan
    on_error: continue

  - id: create_worktree
    name: "Create PR Worktree"
    plugin: github
    step: create_worktree
    on_error: continue

  - id: resolve_context
    name: "Resolve Review Context"
    plugin: github
    step: resolve_review_context

  - id: ai_findings
    name: "AI Review Findings"
    plugin: github
    step: ai_review_findings
    on_error: continue

  - id: normalize
    name: "Normalize Findings"
    plugin: github
    step: normalize_findings

  - id: dedupe
    name: "Deduplicate Findings"
    plugin: github
    step: dedupe_findings

  # Fail-open quality filter: refuted findings are dropped before the human gate;
  # any verification failure just passes findings through unverified.
  - id: verify
    name: "Verify Findings"
    plugin: github
    step: verify_findings
    on_error: continue

  - id: build_actions
    name: "Build Comment Actions"
    plugin: github
    step: build_new_comment_actions
    on_error: continue

  - id: validate_actions
    name: "Validate & Approve Actions"
    plugin: github
    step: validate_review_actions
    on_error: continue

  - id: submit_actions
    name: "Submit Review"
    plugin: github
    step: submit_review_actions
    on_error: continue

  # Backstop only: validate_actions releases the worktree itself right after
  # precomputing every action's code context (so abandoning the review at an
  # interactive gate can't leave a stale worktree). This step covers the paths that
  # never reach validate_actions and the rare early-release failure.
  # on_error: continue so a failed cleanup never masks the review's outcome.
  - id: cleanup_worktree
    name: "Cleanup PR Worktree"
    plugin: github
    step: cleanup_worktree
    on_error: continue
