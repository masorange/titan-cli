name: "Respond to PR Comments"
description: "Review and address pending comments on pull requests you opened or are assigned to"

hooks:
  - after_review

steps:
  - id: select_pr
    name: "Select PR for Review"
    plugin: github
    step: select_pr_for_review

  - id: fetch_comments
    name: "Fetch Pending Comments"
    plugin: github
    step: fetch_pending_comments

  # Check branch is clean before switching to PR branch
  - id: check_clean_state
    name: "Check Branch State"
    plugin: github
    step: check_clean_state

  # Checkout PR branch (saves original branch for restore)
  - id: checkout_pr_branch
    name: "Checkout PR Branch"
    plugin: github
    step: checkout_pr_branch
    on_error: continue

  # The PR's diff, its files and their base versions: what the judging session reads.
  # Shared with Review PR, which fetches exactly the same bundle.
  - id: fetch_bundle
    name: "Fetch PR Review Bundle"
    plugin: github
    step: fetch_pr_review_bundle
    on_error: continue

  - id: build_manifest
    name: "Build Change Manifest"
    plugin: github
    step: build_change_manifest
    on_error: continue

  # One session reads the whole PR and judges every pending comment at once. It changes
  # nothing: its verdicts are shown in the next step for the user to accept, edit or reject.
  # on_error: continue - without verdicts the workflow asks comment by comment, as before.
  - id: judge_comments
    name: "Judge Comments"
    plugin: github
    step: judge_pr_comments
    on_error: continue

  # Review comments - if fails, skip to restore
  - id: review_comments
    name: "Review Comments"
    plugin: github
    step: review_comments
    on_error: continue

  # Hook point: inject linter, tests, or any validation before pushing
  - hook: after_review

  # Push commits - if fails, skip to restore
  - id: push_commits
    name: "Push Commits"
    plugin: github
    step: push_commits
    on_error: continue

  # Send replies - if fails, skip to restore
  - id: send_replies
    name: "Send Comment Replies"
    plugin: github
    step: send_comment_replies
    on_error: continue

  # Request review - if fails, skip to restore
  - id: request_review
    name: "Re-request Review"
    plugin: github
    step: request_review
    on_error: continue

  # Restore original branch ALWAYS runs
  - id: restore_branch
    name: "Restore Branch"
    plugin: github
    step: checkout_original_branch
