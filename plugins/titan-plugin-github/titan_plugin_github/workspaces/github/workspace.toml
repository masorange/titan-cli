[workspace]
name = "github"
version = "0.1.0"
icon = "🔀"
description = "A full screen for GitHub: the pull requests, the merge queue and the CI runs of the repo, in one place"
requires_plugins = ["github"]
events = ["workflow.run", "section.change"]
# Its AI diagnosis runs under the routing task "workspace.github", listed with this label.
ai_task = "PR check diagnosis"
ai_assist_task = "Fix with AI"

[sections.prs]
title = "Pull requests"
description = "Review requests with their review, approve, request-changes and comment buttons, your PRs with reviewers, conflicts, check diagnosis and a merge button, and the other open PRs."

[sections.queue]
title = "Merge queue"
description = "Your place in the repo's merge queue."

[sections.runs]
title = "Workflow runs"
description = "The repo's latest GitHub Actions runs, whoever started them, with a diagnosis of why a failed one failed and buttons to re-run its failed jobs or all of them. The merge queue section lists its own runs under it."

[options.prs_refresh_seconds]
type = "int"
title = "PRs refresh (s)"
default = 30
min = 1

[options.queue_refresh_seconds]
type = "int"
title = "Merge queue refresh (s)"
default = 60
min = 1

[options.runs_refresh_seconds]
type = "int"
title = "Workflow runs refresh (s)"
default = 30
min = 1

[options.refresh_key]
type = "string"
title = "Refresh key"
description = "Key that refreshes every section now; empty for none. The github mod's pane binds f5 for its own summary."
default = ""

[options.queue_shown]
type = "int"
title = "Queue entries shown"
default = 8
min = 0

[options.diagnosis_jobs]
type = "int"
title = "Checks diagnosed per press"
description = "Which AI answers is the task \"workspace.github\" in AI routing: the workspace's picker pins it."
default = 3
min = 1

[options.review_workflow]
type = "string"
title = "Review workflow"
description = "Workflow a review request's Review button runs, given the PR as review_pr_number; empty for no button (Approve/Request changes/Comment stay)."
default = "review-pr"

[options.conflicts_workflow]
type = "string"
title = "Conflict workflow"
description = "Workflow the ⚒ Resolve conflicts button runs, given the PR as conflict_pr_number; empty for no button."
default = "resolve-pr-conflicts"

[options.checks_workflow]
type = "string"
title = "Failing checks workflow"
description = "Workflow the ⚒ Fix with AI button runs, given the PR as fix_pr_number; empty for no button."
default = "fix-pr-checks"

[options.notify_workflow]
type = "string"
title = "Notify workflow"
description = "Workflow the ✉ Notify channel button runs, given the message as slack_message_markdown; it shows only while the Slack plugin is active. Empty for no button."
default = "plugin:slack/post-message"

[options.notify_message]
type = "string"
title = "Notify message"
description = "Markdown the Notify channel button posts. Fields: {number}, {title}, {url}, {author}, {branch}."
default = "Merging [#{number} {title}]({url})"
